name: Upwork Opportunity Scanner

on:
  schedule:
    # GitHub Actions cron uses UTC.
    #
    # We trigger at both possible UTC hours for Kyiv:
    # Winter (UTC+2): 06, 09, 12, 15, 18
    # Summer (UTC+3): 05, 08, 11, 14, 17
    #
    # scanner.py checks Europe/Kyiv local time and only performs
    # a real scan at 08:00, 11:00, 14:00, 17:00, 20:00.
    - cron: '0 5,6,8,9,11,12,14,15,17,18 * * *'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: pip install -r requirements-scanner.txt

      - name: Scan Upwork and send Telegram alerts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          OPPORTUNITY_THRESHOLD: '75'
          AI_ANALYZE_TOP: '25'
          NEW_JOB_ANALYZE_LIMIT: '25'
          RECOVERY_CANDIDATES: '8'

          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

        run: python scanner.py
