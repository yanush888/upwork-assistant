name: Upwork Opportunity Scanner

on:
  schedule:
    # Run every 3 hours from 08:00 to 20:00 Kyiv time.
    # :07 is used instead of :00 to reduce GitHub Actions scheduling delays.
    - cron: '7 8,11,14,17,20 * * *'
      timezone: 'Europe/Kyiv'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: pip install -r requirements-scanner.txt

      - name: Scan Upwork and send Telegram alerts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          OPPORTUNITY_THRESHOLD: '75'
          AI_ANALYZE_TOP: '25'
          NEW_JOB_ANALYZE_LIMIT: '25'
          RECOVERY_CANDIDATES: '8'

          # Scheduled runs and manual runs should both execute scanner.py.
          FORCE_RUN: '1'

        run: python scanner.py
